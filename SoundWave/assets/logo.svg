<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- SoundWave Symbol (Sound bars) -->
  <g transform="translate(4, 8)">
    <rect x="0" y="20" width="5" height="16" rx="2.5" fill="url(#swGrad)" opacity="0.6"/>
    <rect x="8" y="12" width="5" height="30" rx="2.5" fill="url(#swGrad)" opacity="0.8"/>
    <rect x="16" y="4" width="5" height="42" rx="2.5" fill="url(#swGrad)" filter="url(#glow)"/>
    <rect x="24" y="10" width="5" height="34" rx="2.5" fill="url(#swGrad)"/>
    <rect x="32" y="16" width="5" height="24" rx="2.5" fill="url(#swGrad)" opacity="0.9"/>
    <rect x="40" y="8" width="5" height="38" rx="2.5" fill="url(#swGrad)" filter="url(#glow)"/>
    <rect x="48" y="18" width="5" height="20" rx="2.5" fill="url(#swGrad)" opacity="0.7"/>
  </g>
  
  <!-- Textual Logo -->
  <text x="68" y="43" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#ffffff">Sound</tspan>
    <tspan fill="url(#swGrad)">Wave</tspan>
  </text>
  
  <!-- Subtle accent dot -->
  <circle cx="254" cy="22" r="3.5" fill="#c084fc" filter="url(#glow)" />
</svg>
